
name: Keep HostelHub Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Send request to HostelHub
        run: |
          curl --fail --silent --show-error \
          --max-time 30 \
          https://hostel-hub-api-4670.onrender.com/
